logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
micronaut-http-client = { module = "io.micronaut:micronaut-http-client", version = "4.10.22" }
micronaut-http-validation = { module = "io.micronaut:micronaut-http-validation", version = "4.10.22" }
