aws-sdk-s3 = { module = "software.amazon.awssdk:s3", version.ref = "awsSdk" }
forkhandles-result4k = { module = "dev.forkhandles:result4k", version.ref = "forkhandles" }
forkhandles-time4k = { module = "dev.forkhandles:time4k", version.ref = "forkhandles" }
graphql-kotlin-schema-generator = { module = "com.expediagroup:graphql-kotlin-schema-generator", version.ref = "graphqlKotlin" }
hamkrest = { module = "com.natpryce:hamkrest", version.ref = "hamkrest" }
