spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "springBoot" }
typeflows-github = { module = "io.typeflows:typeflows-github", version.ref = "typeflows" }
typeflows-github-marketplace = { module = "io.typeflows:typeflows-github-marketplace", version.ref = "typeflows" }

[plugins]
kotlin-jvm = "org.jetbrains.kotlin.jvm:2.4.0"
ksp = { id = "com.google.devtools.ksp", version.ref = "com-google-devtools-ksp" }
micronaut-application = "io.micronaut.application:4.6.2"
quarkus = { id = "io.quarkus", version.ref = "quarkus" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
typeflows = { id = "io.typeflows", version.ref = "typeflows" }
version-catalog-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "version-catalog-update" }
versions = { id = "com.github.ben-manes.versions", version.ref = "versions" }

[bundles]
junit-testing = [
    "junit-jupiter-api",
    "junit-jupiter-engine",
]
