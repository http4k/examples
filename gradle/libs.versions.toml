micronaut-runtime = { module = "io.micronaut:micronaut-runtime", version = "4.10.22" }
micronaut-serde-jackson = { module = "io.micronaut.serde:micronaut-serde-jackson", version = "2.16.2" }
micronaut-serde-processor = { module = "io.micronaut.serde:micronaut-serde-processor", version = "2.16.2" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbusJoseJwt" }
pulumi-aws = { module = "com.pulumi:aws", version.ref = "pulumiAws" }
pulumi-aws-native = { module = "com.pulumi:aws-native", version.ref = "pulumiAwsNative" }
